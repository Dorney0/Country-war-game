<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Africa War: Global Expansion</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; }
        #ui-left, #ui-right { width: 280px; padding: 20px; background: rgba(10, 10, 15, 0.98); border: 1px solid #222; z-index: 10; }
        #game-container { flex-grow: 1; position: relative; background: #08121c; cursor: crosshair; }
        canvas { display: block; }
        #ui-right { position: relative; }
        .version-info {
            position: absolute; bottom: 10px; right: 10px; font-size: 18px;
            color: #a6a6a6; opacity: 0.7; font-family: monospace; user-select: none; }
        .stat-box { background: #0a0a0a; padding: 12px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #5b5b5b; }
        .stat { font-size: 16px; margin: 4px 0; display: flex; justify-content: space-between; font-family: monospace; }
        .limit { color: #888; font-size: 11px; text-align: right; margin-bottom: 5px; }
        .gold { color: #ffd700; } .troops { color: #00ff88; }
        h3 { color: #3498db; margin: 0 0 10px 0; text-transform: uppercase; font-size: 16px; letter-spacing: 1px; }
        #status { font-weight: bold; text-align: center; color: #00ccff; margin-bottom: 15px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ff4444; }
        #attack-progress { width: 100%; height: 4px; background: #333; margin-top: 5px; border-radius: 2px; overflow: hidden; }
        #attack-progress-bar { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa00); width: 0%; transition: width 0.3s; }
        #game-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        #game-result { background: rgba(20, 20, 30, 0.95); padding: 40px; border-radius: 10px; text-align: center; border: 2px solid #3498db; max-width: 500px; }
        #result-text { font-size: 32px; margin-bottom: 20px; color: #ffcc00; }
        #result-buttons button { margin: 10px; padding: 12px 24px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #result-buttons button:hover { background: #2980b9; }
        .wave-effect { position: absolute; pointer-events: none; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.7); transform: translate(-50%, -50%); }
        .attacking-troops-bar { width: 100%; height: 6px; background: #333; margin: 5px 0; border-radius: 3px; overflow: hidden; }
        .attacking-troops-fill { height: 100%; background: linear-gradient(90deg, #ff3333, #ff8800); width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

<div id="ui-left">
    <h3>ГЕНЕРАЛЬНЫЙ ШТАБ</h3>
    <div id="status">ВЫБЕРИТЕ ТОЧКУ ДЕСАНТА</div>

    <div class="stat-box">
        <div class="stat troops">АРМИЯ: <span id="troop-count">0</span></div>
        <div id="troop-limit" class="limit">Лимит: 0</div>
        <div class="attacking-troops-bar">
            <div id="attacking-troops-fill" class="attacking-troops-fill"></div>
        </div>
        <div id="attacking-troops-text" style="font-size: 11px; color: #ff8888;">В атаке: 0</div>
        <div class="stat gold">ЗОЛОТО: <span id="gold-count">0</span></div>
        <div class="stat" style="font-size: 12px;">ТЕРРИТОРИЯ: <span id="land-count">0</span></div>
        <div id="attack-progress">
            <div id="attack-progress-bar"></div>
        </div>
    </div>

    <div class="stat-box">
        <label style="font-size: 12px;">МОЩЬ ПРОРЫВА: <span id="percent-val">50</span>%</label>
        <div id="attack-troops-info" style="font-size: 11px; color: #aaa; margin-top: 5px;">Войск в атаку: 0</div>
        <input type="range" id="attack-slider" min="5" max="100" value="50">
    </div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="game-overlay">
        <div id="game-result">
            <div id="result-text"></div>
            <div id="result-buttons">
                <button id="restart-btn">ПЕРЕЗАПУСК</button>
                <button id="continue-btn" style="display:none;">ПРОДОЛЖИТЬ</button>
                <button id="spectate-btn" style="display:none;">НАБЛЮДАТЬ</button>
            </div>
        </div>
    </div>
</div>

<div id="ui-right">
    <h3>РАЗВЕДКА</h3>
    <div id="hover-info">Наведите на карту и нажмите, чтобы начать играть...</div>
    <div class="version-info">v0.1.0 (Pre-Alpha)</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapCanvas = document.createElement('canvas');
    const mapCtx = mapCanvas.getContext('2d');
    mapCanvas.width = 250 * 8; // COLS * CELL_SIZE
    mapCanvas.height = 220 * 8; // ROWS * CELL_SIZE



    let lastFrameTime = performance.now();

    let fps = 0;
    let lastFpsUpdate = 0;

    const troopEl = document.getElementById('troop-count');
    const limitEl = document.getElementById('troop-limit');
    const goldEl = document.getElementById('gold-count');
    const landEl = document.getElementById('land-count');
    const slider = document.getElementById('attack-slider');
    const percentVal = document.getElementById('percent-val');
    const statusEl = document.getElementById('status');
    const hoverInfoEl = document.getElementById('hover-info');
    const attackProgressBar = document.getElementById('attack-progress-bar');
    const resultText = document.getElementById('result-text');
    const attackTroopsInfo = document.getElementById('attack-troops-info');
    const attackingTroopsFill = document.getElementById('attacking-troops-fill');
    const attackingTroopsText = document.getElementById('attacking-troops-text');

    // === кнопки меню ===
    const gameOverlay = document.getElementById('game-overlay');
    const continueBtn = document.getElementById('continue-btn');
    const restartBtn = document.getElementById('restart-btn');
    const spectateBtn = document.getElementById('spectate-btn');

    // === обработчики кнопок ===
    continueBtn.addEventListener('click', continueGame);
    restartBtn.addEventListener('click', restartGame);
    spectateBtn.addEventListener('click', spectateGame);

    // УВЕЛИЧЕННЫЕ ПАРАМЕТРЫ КАРТЫ
    const ROWS = 220;
    const COLS = 250;
    const CELL_SIZE = 8;
    const TROOP_LIMIT_BASE = 25000;

    canvas.width = window.innerWidth - 560;
    canvas.height = window.innerHeight;

    let grid = [];
    let players = [];
    let gameStarted = false;
    let preStart = true;
    let botSpawns = [];
    let cam = { x: 0, y: 0, zoom: 1, isDrag: false, lx: 0, ly: 0 };

    canvas.width = window.innerWidth - 560;
    canvas.height = window.innerHeight;

    // НАСТРОЙКА КАМЕРЫ ДЛЯ ОТОБРАЖЕНИЯ ВСЕЙ КАРТЫ
    function centerMapOnScreen() {
        const mapWidth = COLS * CELL_SIZE;
        const mapHeight = ROWS * CELL_SIZE;

        // Вычисляем масштаб, чтобы карта помещалась на экране
        const scaleX = (canvas.width * 0.9) / mapWidth;
        const scaleY = (canvas.height * 0.9) / mapHeight;
        cam.zoom = Math.min(scaleX, scaleY, 1);

        // Центрируем карту
        cam.x = (canvas.width - mapWidth * cam.zoom) / 2;
        cam.y = (canvas.height - mapHeight * cam.zoom) / 2;
    }

    centerMapOnScreen();

    let currentAttack = null;
    let lastNickUpdateTime = 0;
    let totalLandCells = 0;
    let gameEnded = false;
    let ignoreWin80 = false; // Флаг, чтобы не показывать меню победы повторно
    let isSpectating = false;
    let hoverCell = null;
    let lastHoverUpdate = 0;
    let mouseX = 0;
    let mouseY = 0;

    let gameResultType = '';

    // ЯРКИЕ ЦВЕТА КАРТЫ
    const BIOMES = {
        water: "#00479c",
        grass: "#179517",
        mountain: "#5a5a5a"
    };

    // ЯРКИЕ ЦВЕТА ДЛЯ ИГРОКА И 4 СИЛЬНЫХ БОТОВ, ОСТАЛЬНЫЕ ТУСКЛЫЕ
    const COLORS = [
        "#007bff", // Игрок (Синий)
        "#ff3333", "#ffcc00", "#00ffcc", "#ff9900", // 4 Сильных (Красный, Желтый, Бирюзовый, Оранжевый)
        // Пассивные (тусклые цвета)
        "#4a5568", "#5a6268", "#4e5d4c", "#5f4b4b", "#4b5d5f",
        "#555555", "#445544", "#554455", "#444455", "#555544"
    ];

    const NAMES = ["ИГРОК", "Египет", "Нигерия", "ЮАР", "Эфиопия", "Алжир", "Конго", "Марокко", "Кения", "Судан", "Ливия", "Мали", "Чад", "Ангола", "Гана"];
    function formatNum(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
        if (num < 1000) {
            return Math.round(num).toString();
        }
        return Math.floor(num).toString();
    }

    // Генерация маски для большой карты
    function generateMask() {
        let mask = [];

        // Параметры "континентальности"
        const centerX = COLS / 2;
        const centerY = ROWS / 2;
        const maxDist = Math.min(centerX, centerY) * 0.9; // Радиус затухания

        for (let r = 0; r < ROWS; r++) {
            let row = "";
            for (let c = 0; c < COLS; c++) {
                // Принудительно делаем границы водой (чтобы не было обрывов)
                if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
                    row += "0";
                    continue;
                }

                // Вычисляем расстояние от центра (0.0 - центр, 1.0 - край)
                let dx = (c - centerX) / centerX;
                let dy = (r - centerY) / centerY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                // Создаем шум (неровные края)
                // Используем сумму нескольких синусоид для имитации фрактального шума
                let noise =
                    Math.sin(c * 0.1) * 0.15 +
                    Math.cos(r * 0.1) * 0.15 +
                    Math.sin((c + r) * 0.05) * 0.2;

                // Итоговый порог: чем дальше от центра, тем меньше шансов на сушу
                // dist + noise создает "рваный" берег
                let threshold = 0.65;

                if (dist + noise < threshold) {
                    row += "1";
                } else {
                    row += "0";
                }
            }
            mask.push(row);
        }
        return mask;
    }

    function initGrid() {
        grid = [];
        totalLandCells = 0;
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                let isLand = MASK[r][c] === "1";
                if (isLand) totalLandCells++;

                grid[r][c] = {
                    r: r,
                    c: c,
                    owner: null,
                    type: isLand ? 'grass' : 'water'
                };
            }
        }
    }

    const MASK = generateMask();

    class Player {
        constructor(id, name, color, isBot) {
            this.id = id;
            this.name = name;
            this.color = color;
            this.isBot = isBot;
            // Сильными считаем первых 4-х ботов (id от 1 до 4)
            this.isAggressive = !isBot || (id >= 1 && id <= 4);
            // --- НОВАЯ ЛОГИКА НАЧАЛЬНЫХ ВОЙСК ---
            // Если игрок (id 0) — 12500
            // Если агрессивный бот — 6500
            // Если пассивный бот — 500 (совсем мало, чтобы они медленно росли)
            if (this.id === 0) {
                this.troops = 12500;
            } else {
                this.troops = this.isAggressive ? 5500 : 3000;
            }
            this.gold = 0;
            this.cells = [];
            this.maxTroops = TROOP_LIMIT_BASE;
            this.initialAttackTroops = 0;
            this.totalCapturedInAttack = 0;
            this.centerX = 0;
            this.centerY = 0;
            this.targetCenterX = 0;
            this.targetCenterY = 0;
            this._centerDirty = true;
            this._centerTimer = null;
            this.nameX = 0;
            this.nameY = 0;
            this.nameFixed = false;
            this.borderCache = new Map();
            this.contacts = new Map(); // ID врага => количество общих границ (клеток)
            this.enemyBorders = new Map(); // ID врага => Set строк "r,c" (клетки врага, граничащие с нами)
            // Для атаки на врага
            this.attacks = [];

            // Для расширения на свободные территории
            this.expansionQueue = 0;

            this.isBeingAttacked = false;
            this.lastDefenseTime = 0;
            this.waveAnimation = 0;
            this.lastWaveTime = 0;
            this.lastExpansionTime = 0;
            this.lastUpdateTime = Date.now();
            this.availableNeighbors = new Set(); // Используем Set, чтобы координаты не дублировались

            // В constructor(id, name, color, isBot)
            this.personality = Math.random() > 0.7 ? 'aggr' : (Math.random() > 0.4 ? 'bal' : 'def');
            // Даем ботам стартовый разброс по накоплению войск
            this.aggressionThreshold = this.personality === 'aggr' ? 400 : (this.personality === 'def' ? 1500 : 800);
        }

        markCenterDirty() {
            this._centerDirty = true;

            if (this._centerTimer) return;

            this._centerTimer = setTimeout(() => {
                this.recalculateCenter();
                this._centerDirty = false;
                this._centerTimer = null;
            }, 10_000); // ← 10 секунд
        }

        recalculateCenter() {
            if (this.cells.length === 0) return;

            let sumX = 0;
            let sumY = 0;

            // ОПТИМИЗАЦИЯ: Мы хотим проверять не более 200-300 клеток,
            const maxSamples = 200;

            // Вычисляем шаг. Если клеток 10 000, шаг будет 50 (берем каждую 50-ю).
            // Если клеток меньше 200, шаг будет 1 (берем все подряд).
            const step = Math.max(1, Math.floor(this.cells.length / maxSamples));
            let count = 0;

            for (let i = 0; i < this.cells.length; i += step) {
                const cell = this.cells[i];
                sumX += cell.c;
                sumY += cell.r;
                count++;
            }

            // Делим на реальное количество взятых проб (count), а не на длину всего массива
            this.targetCenterX = (sumX / count) * CELL_SIZE;
            this.targetCenterY = (sumY / count) * CELL_SIZE;
        }


        update() {
            if (this.cells.length === 0) return;

            const now = Date.now();
            const deltaTime = Math.min((now - this.lastUpdateTime) / 16.666, 3);


            // Одинаковые правила для всех игроков
            this.maxTroops = TROOP_LIMIT_BASE + (this.cells.length * 80);

            // СКОРОСТЬ ВОССТАНОВЛЕНИЯ ВОЙСК
            if (this.troops < this.maxTroops) {
                const count = this.cells.length;

                // 1. Плавный бонус для выживания (теперь чуть мощнее на старте)
                let tinyBonus = 0;
                if (count < 150) {
                    tinyBonus = (150 - count) * 0.8;
                }

                // 2. Эффективность управления (Увеличена в 5 раз по сравнению с прошлым вариантом)
                // Раньше было 0.008, теперь 0.04 — это даст ощутимый поток войск
                let efficiencyBase = (this.id === 0) ? 0.045 : 0.04;
                let efficiency = efficiencyBase / (1 + count * 0.001);

                // 3. Масштаб империи (Усилен, чтобы большие страны быстрее заполняли лимит)
                let empireScale = Math.pow(count, 1.2) * 0.005;

                // Итоговый расчет скорости (убрал множитель 0.5, теперь рост идет на полную)
                let growthRate = (count * efficiency) + empireScale + tinyBonus;

                // Применяем deltaTime для стабильности FPS
                let growth = growthRate * deltaTime;

                this.troops = Math.min(this.maxTroops, this.troops + growth);
            }

            // Золото с эффектом неэффективности
            let goldGrowth = (this.cells.length * 0.02) * deltaTime;

            // Эффект неэффективности управления для золота
            let goldInefficiencyFactor = 1.0;
            if (this.cells.length > 10000) {
                goldInefficiencyFactor = 10000 / this.cells.length;
            } else if (this.cells.length > 5000) {
                goldInefficiencyFactor = 0.7;
            } else if (this.cells.length > 2000) {
                goldInefficiencyFactor = 0.85;
            }

            if (goldInefficiencyFactor < 1.0) {
                goldGrowth *= goldInefficiencyFactor;
            }

            this.gold += goldGrowth;
            // === КОНЕЦ ДОБАВЛЕНИЯ ДЛЯ ЗОЛОТА ===

            // Обновляем центр игрока
            this.recalculateCenter();

            // Плавно перемещаем ник к центру
            this.updateNamePosition(deltaTime);



            // Сбрасываем статус атаки
            this.isBeingAttacked = false;

            const EXPANSION_DIRS = [
                {r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1},
                {r:-1,c:-1},{r:-1,c:1},{r:1,c:-1},{r:1,c:1}
            ];

            // РАСШИРЕНИЕ НА СВОБОДНЫЕ ТЕРРИТОРИИ - ХАОТИЧНЫЙ ФРОНТ
            if (this.expansionQueue >= 1 && this.availableNeighbors.size > 0) {
                // Скорость захвата (сколько клеток за тик)
                let expansionRate = Math.ceil(Math.min(this.expansionQueue, 15) * deltaTime);

                // Превращаем Set в массив для возможности выбора случайного индекса
                let neighborsArray = Array.from(this.availableNeighbors);

                for (let i = 0; i < expansionRate && neighborsArray.length > 0; i++) {
                    // ХАОТИЧНОСТЬ: берем случайную клетку из списка доступных соседей
                    let randomIndex = Math.floor(Math.random() * neighborsArray.length);
                    let coordsStr = neighborsArray[randomIndex];
                    let [nr, nc] = coordsStr.split(',').map(Number);

                    // ПРОВЕРКА ПЛОТНОСТИ: захватываем только если клетка все еще свободна
                    if (grid[nr][nc].owner === null) {
                        this.capture(nr, nc);
                        this.expansionQueue--;
                    }

                    // Удаляем из общего списка соседей игрока
                    this.availableNeighbors.delete(coordsStr);
                    // Удаляем из временного массива текущего кадра, чтобы не выбрать дважды
                    neighborsArray.splice(randomIndex, 1);
                }
            }

            // АТАКА НА ВРАГОВ (МНОЖЕСТВЕННЫЕ АТАКИ)
            for (let i = this.attacks.length - 1; i >= 0; i--) {
                let attack = this.attacks[i];
                let enemy = players[attack.target];

                // Если враг стерт с лица земли другими или тобой
                if (!enemy || enemy.cells.length === 0) {
                    this.troops += Math.max(0, attack.troops);
                    this.attacks.splice(i, 1);
                    continue;
                }

                enemy.isBeingAttacked = true;

                // --- ФАЗА 1: БИТВА (Сбалансированный урон) ---
                // Уменьшаем базовый урон обороны, чтобы атака жила дольше
                let ourAtkPower = attack.troops * 0.015 * deltaTime;
                let enemyDefPower = enemy.troops * 0.012 * deltaTime;

                // Если мы атакуем бота, который намного слабее, мы почти не несем потерь
                if (attack.troops > enemy.troops * 2) enemyDefPower *= 0.5;

                enemy.troops = Math.max(0, enemy.troops - ourAtkPower);
                attack.troops = Math.max(0, attack.troops - enemyDefPower);

                // --- ФАЗА 2: ДИНАМИЧЕСКИЙ ЗАХВАТ ---
                let enemyCellCount = enemy.cells.length;
                let captureEfficiency = Math.max(1, Math.floor(attack.troops / 100));
                let dominanceMultiplier = Math.max(1.0, this.cells.length / (enemyCellCount || 1));

                // ЭФФЕКТ КОЛЛАПСА: Если у врага осталось мало клеток, скорость захвата взлетает
                if (enemyCellCount < 100) {
                    // Чем меньше клеток у врага, тем яростнее захват (до х10 скорости)
                    dominanceMultiplier *= (10 - (enemyCellCount / 10));
                }
                let maxAttempts = Math.min(Math.floor(captureEfficiency * dominanceMultiplier), 150);

                // Если войск много, а враг крошечный — гарантируем минимум 10 попыток за тик
                if (attack.troops > 1000 && enemyCellCount < 20) maxAttempts = Math.max(maxAttempts, 20);

                for (let j = 0; j < maxAttempts; j++) {
                    // При агонии врага шанс успеха 100%
                    let successChance = enemyCellCount < 30 ? 1.0 : 0.85;

                    if (Math.random() < successChance) {
                        if (this.captureEnemyTerritory(enemy)) {
                            attack.troops = Math.max(0, attack.troops - 0.3); // Удешевляем захват последних крох
                        }
                    }
                }

                // --- ФАЗА 3: ОБНОВЛЕНИЕ СОСТОЯНИЯ АТАКИ ---
                // Рассчитываем прогресс захвата для UI
                // Мы сравниваем изначальное количество войск в отряде с текущим остатком
                if (attack.initialTroops > 0) {
                    attack.progress = attack.troops / attack.initialTroops;
                }

                // Если это атака игрока (id === 0), обновляем полоску прогресса в интерфейсе
                if (this.id === 0) {
                    // Берем прогресс первой активной атаки для индикатора слева
                    let mainAttack = this.attacks[0];
                    if (mainAttack) {
                        attackProgressBar.style.width = (mainAttack.progress * 100) + "%";
                        attackingTroopsFill.style.width = (mainAttack.progress * 100) + "%";
                        attackingTroopsText.innerText = `В атаке: ${formatNum(mainAttack.troops)}`;
                    }
                }

                // Визуальный эффект: если атака идет успешно, создаем пульсацию на границе
                if (now - this.lastWaveTime > 500) {
                    this.createAttackWaveEffect(enemy);
                    this.lastWaveTime = now;
                }

                // --- ФАЗА 4: ПОЛНОЕ УНИЧТОЖЕНИЕ ОТРЯДА ---
                // Если в результате боя или захвата земель у нас осталось меньше 10 войск,
                // отряд считается полностью уничтоженным гарнизоном врага.
                if (attack.troops <= 10) {
                    // Сообщаем в статус (если это игрок)
                    if (this.id === 0) statusEl.innerText = "АТАКА ПОДАВЛЕНА ВОЙСКАМИ ВРАГА!";
                    this.attacks.splice(i, 1);
                    continue;
                }

                // Обновляем прогресс-бар в UI на основе выживших
                if (attack.initialTroops > 0) {
                    // Показываем, сколько % отряда еще живо
                    attack.progress = attack.troops / attack.initialTroops;
                }
            }

            // БОТЫ РАСШИРЯЮТСЯ И АТАКУЮТ (логика ботов)
            // Увеличиваем интервал и добавляем случайное смещение, чтобы боты не думали в один и тот же кадр
            // --- ОБНОВЛЕННАЯ ЛОГИКА БОТОВ (АГРЕССИВНЫЕ VS ПАССИВНЫЕ) ---
            // Устанавливаем интервал: агрессивные думают быстрее, пассивные — медленнее
            let decisionInterval = this.isAggressive ? 500 : 1500;

            if (this.isBot && now - this.lastExpansionTime > (decisionInterval + Math.random() * 200)) {

                // 1. ЛОГИКА ДЛЯ АГРЕССИВНЫХ БОТОВ (ХИЩНИКИ)
                if (this.isAggressive) {
                    if (this.troops > this.aggressionThreshold) {
                        let targets = [];

                        for (let [enemyId, borderSet] of this.enemyBorders) {
                            let enemy = players[enemyId];
                            if (!enemy || enemy.cells.length === 0) continue;

                            let powerAdvantage = this.troops / Math.max(1, enemy.troops);
                            let priority = Math.random() * 20;

                            // --- НОВАЯ СТРАТЕГИЧЕСКАЯ ЛОГИКА ---
                            if (enemy.isAggressive === false) {
                                // Если сосед пассивный и слишком мал (меньше 5% от карты или 1000 войск)
                                // Агрессор "ждет", пока тот накопит ресурсы
                                if (enemy.cells.length < 300 || enemy.troops < 2000) {
                                    priority -= 50; // Снижаем приоритет атаки, даем вырасти
                                } else {
                                    priority += 40; // Теперь он достаточно "сочный", можно есть
                                }
                            } else {
                                // Если сосед — другой агрессор, атакуем его активнее!
                                // Чтобы он не съел наших пассивных ботов ("нашу еду")
                                priority += 60;
                                if (powerAdvantage > 1.2) priority += 30;
                            }

                            if (priority > 50) targets.push({enemy, priority});
                        }

                        if (targets.length > 0) {
                            targets.sort((a, b) => b.priority - a.priority);
                            let chosen = targets[0].enemy;

                            // Расчет бюджета
                            let attackPercent = this.personality === 'aggr' ? 0.4 : 0.25;
                            let desiredBudget = this.troops * attackPercent;

                            // Не тратим слишком много на захват
                            let overkillLimit = chosen.troops * 1.5 + 1000;
                            let finalBudget = Math.min(desiredBudget, overkillLimit);

                            // Атакуем, только если останется надежный резерв для защиты своих границ
                            if (finalBudget > 100 && (this.troops - finalBudget) > (this.maxTroops * 0.3)) {
                                this.troops -= finalBudget;
                                this.startAttack(chosen.id, finalBudget);
                                this.lastExpansionTime = now;
                            }
                        } else if (this.availableNeighbors.size > 0) {
                            this.expandDirectly(now);
                        }
                    }
                }
                // 2. ЛОГИКА ДЛЯ ПАССИВНЫХ БОТОВ (КОРМ)
                else if (this.availableNeighbors.size > 0) {
                    // Пассивные боты никогда не атакуют первыми, только занимают пустоту
                    this.expandDirectly(now);
                }
            }

            // --- ЛОГИКА КОНТРАТАКИ (Только для агрессивных) ---
            // Пассивные боты не контратакуют, что экономит производительность
            if (this.isAggressive && this.isBeingAttacked && this.troops > 100 && Math.random() < 0.05 * deltaTime) {
                for (let i = 0; i < players.length; i++) {
                    let attacker = players[i];
                    if (attacker && attacker.attacks) {
                        for (let attack of attacker.attacks) {
                            if (attack.target === this.id && attack.troops > 0) {
                                // Контратака: бьем в ответ на 10% от текущих войск
                                let counterPower = Math.min(this.troops * 0.1, attack.troops * 1.2);
                                if (counterPower > 50) {
                                    this.troops -= counterPower;
                                    this.startAttack(attacker.id, counterPower);
                                    break;
                                }
                            }
                        }
                    }
                }
            }

            this.lastUpdateTime = now;
        }

        expandDirectly(now) {
            // Пассивное расширение: тратим до 10% войск на захват свободных клеток
            let expAmount = Math.min(this.troops * 0.1, 800);
            this.troops -= expAmount;
            this.expansionQueue += expAmount;
            this.lastExpansionTime = now;
        }

        getBorderWith(enemy) {
            if (this.borderCache.has(enemy.id)) {
                return this.borderCache.get(enemy.id);
            }

            let borders = this.findBorderCellsWithEnemy(enemy);
            this.borderCache.set(enemy.id, borders);
            return borders;
        }

        findWeakestEnemy() {
            let weakest = null;
            let minTroops = Infinity;

            for (let i = 0; i < players.length; i++) {
                let p = players[i];

                // Не выбираем себя и мертвых
                if (p && p.id !== this.id && p.cells.length > 0) {

                    // Проверяем наличие границы с этим игроком
                    let hasBorder = false;
                    if (this.enemyBorders.has(p.id) && this.enemyBorders.get(p.id).size > 0) {
                        hasBorder = true;
                    }

                    // УСЛОВИЕ: Атакуем только если враг слабее нас (минимум на 20%)
                    // И ищем самого слабого среди тех, кто слабее нас
                    if (hasBorder && p.troops < this.troops * 0.8) {
                        if (p.troops < minTroops) {
                            minTroops = p.troops;
                            weakest = p;
                        }
                    }
                }
            }
            return weakest;
        }

        findBorderCellsWithEnemy(enemy) {
            if (!enemy || !this.enemyBorders.has(enemy.id)) return [];

            let borderSet = this.enemyBorders.get(enemy.id);
            if (borderSet.size === 0) {
                // Если через границы не нашли, берем случайные клетки врага напрямую (прорыв в тыл)
                if (enemy.cells.length > 0 && enemy.cells.length < 10) {
                    return [enemy.cells[Math.floor(Math.random() * enemy.cells.length)]];
                }
                return [];
            }

            // Берем до 100 случайных точек границы без сортировки
            let borders = Array.from(borderSet);
            let result = [];
            let samples = Math.min(borders.length, 100);

            for(let i = 0; i < samples; i++) {
                let idx = Math.floor(Math.random() * borders.length);
                const [r, c] = borders[idx].split(',').map(Number);
                result.push({r, c});
            }
            return result;
        }

        createAttackWaveEffect(enemy) {
            if (enemy && enemy.cells.length > 0) {
                let borderCells = this.getBorderWith(enemy);
                if (borderCells.length > 0) {
                    let borderCell = borderCells[Math.floor(Math.random() * borderCells.length)];

                    ctx.save();
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.arc(
                        borderCell.c * CELL_SIZE + CELL_SIZE/2,
                        borderCell.r * CELL_SIZE + CELL_SIZE/2,
                        40 + Math.sin(this.waveAnimation * 2) * 15,
                        0, Math.PI * 2
                    );
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        captureEnemyTerritory(enemy) {
            if (!enemy || enemy.cells.length === 0) return false;

            let borderCells = this.findBorderCellsWithEnemy(enemy);
            let targetCell = null;

            if (borderCells.length > 0) {
                // Убираем фиксированный sampleSize в 20 штук.
                // Вместо этого берем случайную клетку из ВСЕГО массива границ.
                // Это гарантирует, что даже если граница в 1 пиксель, мы в нее попадем.
                targetCell = borderCells[Math.floor(Math.random() * borderCells.length)];
            }
            else if (enemy.cells.length > 0) {
                // Если явных границ нет (анклав), берем любую клетку врага
                targetCell = enemy.cells[Math.floor(Math.random() * enemy.cells.length)];
            }

            if (targetCell) {
                // Проверяем актуальность владельца перед захватом
                const cell = grid[targetCell.r][targetCell.c];
                if (cell.owner === enemy.id) {
                    this.capture(targetCell.r, targetCell.c);
                    return true;
                }
            }
            return false;
        }

        // Дополнительный вспомогательный метод для подсчета ваших клеток вокруг точки
        countFriendlyNeighbors(r, c) {
            let count = 0;
            const dirs = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1},{r:-1,c:-1},{r:-1,c:1},{r:1,c:-1},{r:1,c:1}];
            for (let d of dirs) {
                let nr = r + d.r, nc = c + d.c;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (grid[nr][nc].owner === this.id) count++;
                }
            }
            return count;
        }

        startAttack(enemyId, budget) {
            // Проверяем, не атакуем ли мы уже этого врага
            let existingAttack = this.attacks.find(a => a.target === enemyId);

            if (existingAttack) {
                // Усиливаем существующую атаку
                existingAttack.troops += budget;
                existingAttack.initialTroops += budget;
                return existingAttack;
            } else {
                // Начинаем новую атаку
                let newAttack = {
                    target: enemyId,
                    troops: budget,
                    progress: 0,
                    initialTroops: budget
                };
                this.attacks.push(newAttack);
                return newAttack;
            }
        }

        capture(r, c) {

            if (this.cells.length === 0) {
                // Если это самая первая клетка игрока,
                // принудительно сканируем всё вокруг неё один раз
                const dirs = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}];
                for (let d of dirs) {
                    let nr = r + d.r, nc = c + d.c;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (grid[nr][nc].owner === null) {
                            this.availableNeighbors.add(`${nr},${nc}`);
                        }
                    }
                }
            }

            if (this.cells.length === 1) {
                // Устанавливаем координаты сразу в пикселях
                this.targetCenterX = c * CELL_SIZE;
                this.targetCenterY = r * CELL_SIZE;
                this.centerX = this.targetCenterX;
                this.centerY = this.targetCenterY;
                this.nameX = this.targetCenterX; // Если используете nameX для отрисовки
                this.nameY = this.targetCenterY;
            }

            let cell = grid[r][c];
            let oldOwnerId = cell.owner;

            // 1. УДАЛЕНИЕ У ПРЕДЫДУЩЕГО ВЛАДЕЛЬЦА
            if (oldOwnerId !== null) {
                let prev = players[oldOwnerId];
                if (prev) {
                    const idx = prev.cells.findIndex(i => i.r === r && i.c === c);
                    if (idx !== -1) {
                        if (prev.cells.length < 50) {
                            prev.cells.splice(idx, 1);
                        } else {
                            prev.cells[idx] = prev.cells[prev.cells.length - 1];
                            prev.cells.pop();
                        }
                    }
                    // Очищаем старые границы
                    prev.enemyBorders.forEach(borderSet => borderSet.delete(`${r},${c}`));
                    prev.troops += 0.1;
                }
            }

            // 2. ПЕРЕХОД КЛЕТКИ К НОВОМУ ВЛАДЕЛЬЦУ
            cell.owner = this.id;
            this.cells.push({r, c});

            mapCtx.fillStyle = this.color;
            mapCtx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);

            // 3. ОБНОВЛЕНИЕ ГРАНИЦ (СВОИХ И СОСЕДЕЙ)
            const dirs = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}];
            for (let d of dirs) {
                let nr = r + d.r, nc = c + d.c;

                // Проверяем границы массива
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    let neighbor = grid[nr][nc];

                    // А) Если сосед — пустая земля
                    if (neighbor.type !== 'water' && neighbor.owner === null) {
                        this.availableNeighbors.add(`${nr},${nc}`);
                    }

                    // Б) Если сосед — другой игрок (ВРАГ)
                    if (neighbor.owner !== null && neighbor.owner !== this.id) {
                        let enemyId = neighbor.owner;
                        let enemyPlayer = players[enemyId];

                        // Нам: добавляем клетку врага в наш список целей
                        if (!this.enemyBorders.has(enemyId)) {
                            this.enemyBorders.set(enemyId, new Set());
                        }
                        this.enemyBorders.get(enemyId).add(`${nr},${nc}`);

                        // Врагу: добавляем нашу новую клетку в его список целей (чтобы он видел границу с нами)
                        if (enemyPlayer) {
                            if (!enemyPlayer.enemyBorders.has(this.id)) {
                                enemyPlayer.enemyBorders.set(this.id, new Set());
                            }
                            enemyPlayer.enemyBorders.get(this.id).add(`${r},${c}`);
                        }
                    }
                }
            }

            // 4. ЗАВЕРШЕНИЕ
            this.availableNeighbors.delete(`${r},${c}`);
            this.markCenterDirty();
        }

        updateNamePosition(deltaTime) {
            const speed = 0.05; // скорость движения ника
            this.nameX += (this.targetCenterX - this.nameX) * speed * deltaTime;
            this.nameY += (this.targetCenterY - 20 - this.nameY) * speed * deltaTime;
        }

    }

    function updateNeighborContacts(r, c, oldOwnerId, newOwnerId) {
        const dirs = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}];

        for (let d of dirs) {
            let nr = r + d.r, nc = c + d.c;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                let neighborOwner = grid[nr][nc].owner;

                // Если у соседа есть владелец и это не тот же игрок, который делает захват
                if (neighborOwner !== null) {
                    // Уменьшаем контакт со старым владельцем
                    if (oldOwnerId !== null && neighborOwner !== oldOwnerId) {
                        let count = players[oldOwnerId].contacts.get(neighborOwner) || 0;
                        players[oldOwnerId].contacts.set(neighborOwner, Math.max(0, count - 1));

                        let countRev = players[neighborOwner].contacts.get(oldOwnerId) || 0;
                        players[neighborOwner].contacts.set(oldOwnerId, Math.max(0, countRev - 1));
                    }

                    // Увеличиваем контакт с новым владельцем
                    if (newOwnerId !== null && neighborOwner !== newOwnerId) {
                        let count = players[newOwnerId].contacts.get(neighborOwner) || 0;
                        players[newOwnerId].contacts.set(neighborOwner, count + 1);

                        let countRev = players[neighborOwner].contacts.get(newOwnerId) || 0;
                        players[neighborOwner].contacts.set(newOwnerId, countRev + 1);
                    }
                }
            }
        }
    }

    function showPlayerNicksSequentially() {
        let delay = 0;
        const interval = 200; // миллисекунды между появлением ников

        for (let i = 0; i < players.length; i++) {
            const p = players[i];
            if (!p) continue;

            setTimeout(() => {
                // Ник сразу ставим над центром игрока
                p.nameFixed = false; // пусть ник двигается
                p.recalculateCenter(); // пересчёт центра для плавного движения

            }, delay);

            delay += interval;
        }
    }

    function initMap() {
        grid = [];
        totalLandCells = 0;
        // Заливаем фон водой сразу
        mapCtx.fillStyle = BIOMES.water;
        mapCtx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);

        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                let isLand = MASK[r][c] === '1';
                // Добавляем координаты r, c в объект клетки для удобства
                grid[r][c] = { type: isLand ? (Math.random() > 0.98 ? 'mountain' : 'grass') : 'water', owner: null, r: r, c: c };

                if (isLand) {
                    totalLandCells++;
                    // СРАЗУ РИСУЕМ НА БУФЕРЕ
                    mapCtx.fillStyle = BIOMES[grid[r][c].type];
                    mapCtx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }
        }

        const minDistance = 35;

        for (let i = 1; i < 40; i++) {
            let found = false;
            let pr, pc;
            let attempts = 0;

            while(!found && attempts < 3000) {
                pr = Math.floor(Math.random() * ROWS);
                pc = Math.floor(Math.random() * COLS);

                if (grid[pr][pc].type !== 'water') {
                    let tooClose = false;
                    for (let j = 0; j < botSpawns.length; j++) {
                        let bot = botSpawns[j];
                        let distance = Math.sqrt(
                            Math.pow(pr - bot.r, 2) +
                            Math.pow(pc - bot.c, 2)
                        );
                        if (distance < minDistance) {
                            tooClose = true;
                            break;
                        }
                    }

                    if (!tooClose) {
                        if (pr > 20 && pr < ROWS - 20 && pc > 20 && pc < COLS - 20) {
                            found = true;
                        }
                    }
                }
                attempts++;
            }

            if (found) {
                botSpawns.push({r: pr, c: pc, color: COLORS[i % COLORS.length]});
            }
        }
    }

    function spawnBall(r, c, id, radius = 4) {
        for (let dr = -radius; dr <= radius; dr++) {
            for (let dc = -radius; dc <= radius; dc++) {
                if (Math.random() < 0.8) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        let dist = dr*dr + dc*dc;
                        if (dist <= radius*radius + Math.random() * 2 && grid[nr][nc].type !== 'water') {
                            players[id].capture(nr, nc);
                        }
                    }
                }
            }
        }
    }

    function findSafeSpawnPoint(r, c) {
        if (grid[r][c].type === 'water') {
            for (let radius = 1; radius <= 30; radius++) {
                for (let dr = -radius; dr <= radius; dr++) {
                    for (let dc = -radius; dc <= radius; dc++) {
                        if (Math.abs(dr) === radius || Math.abs(dc) === radius) {
                            const nr = r + dr;
                            const nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                if (grid[nr][nc].type !== 'water') {
                                    return {r: nr, c: nc};
                                }
                            }
                        }
                    }
                }
            }
            return {r, c};
        }

        if (grid[r][c].owner === null) {
            return {r, c};
        }

        for (let radius = 1; radius <= 10; radius++) {
            let closestPoint = null;
            let minDistance = Infinity;

            for (let dr = -radius; dr <= radius; dr++) {
                for (let dc = -radius; dc <= radius; dc++) {
                    if (Math.abs(dr) === radius || Math.abs(dc) === radius) {
                        const nr = r + dr;
                        const nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            if (grid[nr][nc].type !== 'water' && grid[nr][nc].owner === null) {
                                let distance = Math.sqrt(dr*dr + dc*dc);
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    closestPoint = {r: nr, c: nc};
                                }
                            }
                        }
                    }
                }
            }

            if (closestPoint) {
                return closestPoint;
            }
        }

        return {r, c};
    }

    function updateAttackTroopsInfo() {
        if (players[0]) {
            let budget = players[0].troops * (slider.value / 100);
            attackTroopsInfo.textContent = `Войск в атаку: ${formatNum(budget)}`;
        }
    }

    function updateAttackingTroopsBar() {
        // Добавляем проверку на режим наблюдения
        if (isSpectating) return;

        if (players[0]) {
            let attacking = 0;
            if (players[0].attacks) {
                attacking = players[0].attacks.reduce((sum, attack) => sum + attack.troops, 0);
            }

            let total = players[0].troops + attacking;
            let percent = total > 0 ? (attacking / total) * 100 : 0;

            attackingTroopsFill.style.width = percent + '%';
            attackingTroopsText.textContent = `В атаке: ${formatNum(attacking)}`;
        }
    }

    function start(r, c) {
        const safePoint = findSafeSpawnPoint(r, c);

        if (grid[safePoint.r][safePoint.c].type === 'water') {
            statusEl.innerText = "Нельзя начинать в воде!";
            return;
        }

        players[0] = new Player(0, NAMES[0], COLORS[0], false);
        spawnBall(safePoint.r, safePoint.c, 0, 5);

        // Спавним ботов
        for (let i = 1; i < 40; i++) {
            if (botSpawns[i-1]) {
                players[i] = new Player(i, NAMES[i % NAMES.length] || `Бот ${i}`, COLORS[i % COLORS.length], true);
                spawnBall(botSpawns[i-1].r, botSpawns[i-1].c, i, 4);
            }
        }
        //показ ников
        showPlayerNicksSequentially();
        preStart = false;
        gameStarted = true;
        gameEnded = false;
        statusEl.innerText = "ГЛОБАЛЬНАЯ ЭКСПАНСИЯ";

        // Боты начинают расширяться
        for (let i = 1; i < players.length; i++) {
            if (players[i]) {
                players[i].troops -= 150;
                players[i].expansionQueue += 150;
            }
        }
    }

    function checkGameEnd() {
        // Если мы УЖЕ в режиме наблюдения, не нужно снова проверять смерть
        if (!gameStarted || gameEnded || isSpectating) return false;

        let player = players[0];

        // ПРОИГРЫШ
        if (!player || player.cells.length === 0) {
            gameEnded = true;
            gameResultType = 'lose';
            resultText.textContent = "ВАША ДЕРЖАВА ПАЛА!";
            resultText.style.color = "#ff4444";

            // Показываем "Перезапуск" и "Наблюдать"
            continueBtn.style.display = 'none';
            spectateBtn.style.display = 'inline-block';
            restartBtn.style.display = 'inline-block';
            gameOverlay.style.display = 'flex';
            return true;
        }

        // Проверка живых врагов
        let otherPlayersExist = players.slice(1).some(p => p && p.cells.length > 0);

        // ПОБЕДА (врагов нет)
        if (!otherPlayersExist) {
            gameEnded = true;
            gameResultType = 'win';
            resultText.textContent = "МИРОВОЕ ГОСПОДСТВО!";
            resultText.style.color = "#ffd700";

            // Показываем "Перезапуск" и "Продолжить"
            continueBtn.style.display = 'inline-block';
            spectateBtn.style.display = 'none';
            restartBtn.style.display = 'inline-block';
            gameOverlay.style.display = 'flex';
            return true;
        }

        // ПОБЕДА (80%)
        let playerLandPercent = (player.cells.length / totalLandCells) * 100;
        if (playerLandPercent >= 80 && !ignoreWin80) {
            gameEnded = true;
            gameResultType = 'win80';
            resultText.textContent = "ТЫ ПОБЕДИЛ! (80%)";
            resultText.style.color = "#00ff88";

            // Показываем "Перезапуск" и "Продолжить"
            continueBtn.style.display = 'inline-block';
            spectateBtn.style.display = 'none';
            restartBtn.style.display = 'inline-block';
            gameOverlay.style.display = 'flex';
            return true;
        }

        return false;
    }

    function restartGame() {
        console.log("Рестарт игры");
        gameOverlay.style.display = 'none'; // Всегда скрываем

        ignoreWin80 = false;
        isSpectating = false;
        gameResultType = '';

        // Скрываем все кнопки на всякий случай
        continueBtn.style.display = 'none';
        spectateBtn.style.display = 'none';
        // Скрываем оверлей
        gameOverlay.style.display = 'none';

        // Сбрасываем все игровые состояния
        players = [];
        gameStarted = false;
        preStart = true;
        botSpawns = [];
        gameEnded = false;

        // Восстанавливаем UI
        slider.disabled = false;
        canvas.style.cursor = "crosshair";

        // Пересоздаем карту
        initMap();

        // Сбрасываем камеру
        centerMapOnScreen();

        statusEl.innerText = "ВЫБЕРИТЕ ТОЧКУ ДЕСАНТА";
        statusEl.style.color = "#00ccff";

        // Сбрасываем статистику
        troopEl.innerText = "0";
        limitEl.innerText = "Лимит: 0";
        goldEl.innerText = "0";
        landEl.innerText = "0";
        attackTroopsInfo.textContent = "Войск в атаку: 0";

        console.log("Игра перезапущена");
    }

    // Функция продолжения игры
    function continueGame() {
        console.log("Кнопка Продолжить нажата, тип результата:", gameResultType);

        // Проверяем, не было ли уже обработано это нажатие
        if (gameEnded && (gameResultType === 'win80' || gameResultType === 'win')) {
            ignoreWin80 = true;
            gameOverlay.style.display = 'none';

            gameEnded = false;
            gameStarted = true;

            // Меняем статус в зависимости от типа победы
            if (gameResultType === 'win') {
                statusEl.innerText = "МИРОВОЕ ГОСПОДСТВО ДОСТИГНУТО!";
            } else {
                statusEl.innerText = "ПОБЕДА! ДОБИВАЙ ОСТАТКИ ВРАГА";
            }
            statusEl.style.color = "#00ff88";

            // Убедитесь, что UI работает
            slider.disabled = false;
            canvas.style.cursor = "crosshair";

            console.log("Продолжение игры после победы");

            // Сбрасываем gameResultType, чтобы предотвратить повторные срабатывания
            gameResultType = '';
        }
    }

    // Новая функция для кнопки "Наблюдать"
    function spectateGame() {
        console.log("Кнопка Наблюдать нажата");
        gameOverlay.style.display = 'none'; // Всегда скрываем

        isSpectating = true;
        gameEnded = false; // Снимаем флаг окончания
        gameStarted = true; // Игра продолжается
        statusEl.innerText = "РЕЖИМ НАБЛЮДЕНИЯ";
        statusEl.style.color = "#aaaaaa";

        // Отключаем UI управления для игрока, но разрешаем перемещение камеры
        slider.disabled = true;
        canvas.style.cursor = "move"; // Меняем курсор на "перемещение"

        // Сбрасываем UI игрока
        troopEl.innerText = "0";
        limitEl.innerText = "Лимит: 0";
        goldEl.innerText = "0";
        landEl.innerText = "0";
        attackTroopsInfo.textContent = "Войск в атаку: 0";
        attackProgressBar.style.width = "0%";
        attackingTroopsFill.style.width = "0%";
        attackingTroopsText.textContent = "В атаке: 0";

        console.log("Включен режим наблюдения");
    }

    function updateHoverInfo() {
        if (!gameStarted || gameEnded) return;

        if (Date.now() - lastHoverUpdate < 100) return;

        const rect = canvas.getBoundingClientRect();
        const wx = (mouseX - rect.left - cam.x) / cam.zoom;
        const wy = (mouseY - rect.top - cam.y) / cam.zoom;
        const c = Math.floor(wx / CELL_SIZE);
        const r = Math.floor(wy / CELL_SIZE);

        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
            let cell = grid[r][c];
            if (cell.owner !== null && players[cell.owner]) {
                let p = players[cell.owner];
                hoverInfoEl.innerHTML = `<b style="color:${p.color}; font-size:1.3em">${p.name}</b><hr>Армия: ${formatNum(p.troops)}<br>Лимит: ${formatNum(p.maxTroops)}<br>Территория: ${p.cells.length} px²`;
            } else {
                hoverInfoEl.innerHTML = "Свободная территория";
            }
        }
        lastHoverUpdate = Date.now();
    }
    // ОБРАБОТКА захвата врага
    canvas.addEventListener('mousedown', (e) => {
        //проверка на наблюдателя
        if (isSpectating) return;

        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left - cam.x) / cam.zoom;
        const y = (e.clientY - rect.top - cam.y) / cam.zoom;
        const c = Math.floor(x / CELL_SIZE), r = Math.floor(y / CELL_SIZE);

        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
        const cell = grid[r][c];
        const p = players[0]; // Игрок

        // Если это первый клик игры (выбор десанта)
        if (preStart) {
            if (cell.type !== 'water') {
                p.capture(r, c);
                preStart = false;
                statusEl.innerText = "ГЛОБАЛЬНАЯ ЭКСПАНСИЯ";
            }
            return;
        }

        const attackPercent = slider.value / 100;
        const cost = p.troops * attackPercent;

        if (cell.owner !== null && cell.owner !== p.id) {
            // --- ПРОВЕРКА ГРАНИЦЫ ПЕРЕД АТАКОЙ ---
            const enemy = players[cell.owner];
            const borders = p.findBorderCellsWithEnemy(enemy);

            if (borders.length > 0) {
                p.troops -= cost;
                p.startAttack(enemy.id, cost);
                statusEl.innerText = `АТАКА НА ${enemy.name.toUpperCase()}`;
            } else {
                statusEl.innerText = "НЕТ ОБЩЕЙ ГРАНИЦЫ ДЛЯ АТАКИ!";
                // Эффект тряски или звука можно добавить тут
            }
        } else if (cell.owner === null && cell.type !== 'water') {
            // Обычное расширение на пустую землю
            p.troops -= cost;
            p.expansionQueue += cost;
            statusEl.innerText = "РАСШИРЕНИЕ ТЕРРИТОРИИ";
        }
    });

    // ОБРАБОТКА МЫШИ
    canvas.addEventListener('mousedown', function(e) {
        if (e.button !== 0 || gameEnded) return;

        cam.isDrag = true;
        cam.lx = e.clientX;
        cam.ly = e.clientY;
        cam.d = 0;
        e.preventDefault();
    });

    window.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (gameEnded) {
            cam.isDrag = false;
            return;
        }

        if (cam.isDrag) {
            let dx = e.clientX - cam.lx;
            let dy = e.clientY - cam.ly;
            cam.x += dx;
            cam.y += dy;
            cam.lx = e.clientX;
            cam.ly = e.clientY;
            cam.d += Math.sqrt(dx*dx + dy*dy);
        }
    });

    window.addEventListener('mouseup', function(e) {
        if (e.button !== 0 || gameEnded ) return;

        if (cam.isDrag && cam.d < 10) {
            if (isSpectating) {  // игнор клика в наблюдении
                cam.isDrag = false;  // Сброс, чтобы не "зажимало"
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const wx = (e.clientX - rect.left - cam.x) / cam.zoom;
            const wy = (e.clientY - rect.top - cam.y) / cam.zoom;
            const c = Math.floor(wx / CELL_SIZE);
            const r = Math.floor(wy / CELL_SIZE);

            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                if (isSpectating) return;  // игнорируем клики в наблюдении

                if (preStart) {
                    start(r, c);
                } else if (players[0]) {
                    //проверка на наблюдателя
                    if (isSpectating) return;

                    let p = players[0];
                    let cell = grid[r][c];

                    if (cell.owner === null) {
                        // Расширение на свободную территорию
                        let budget = p.troops * (slider.value / 100);
                        if (budget > 10) {
                            p.troops -= budget;
                            p.expansionQueue += budget;
                            statusEl.innerText = "РАСШИРЕНИЕ ТЕРРИТОРИИ";
                        }
                    } else if (cell.owner !== 0) {
                        let enemy = players[cell.owner];
                        if (enemy) {
                            // Проверка границ
                            let hasBorder = (p.contacts.get(enemy.id) || 0) > 0;

                            if (hasBorder) {
                                // ПРОВЕРКА: можно ли атаковать врага с текущими силами
                                let budget = p.troops * (slider.value / 100);

                                if (budget > 10) {
                                    // НОВЫЙ КОД: Используем метод startAttack из класса Player
                                    p.troops -= budget;
                                    p.startAttack(enemy.id, budget);
                                    statusEl.innerText = `АТАКА НА ${enemy.name}`;
                                } else {
                                    statusEl.innerText = "НЕДОСТАТОЧНО ВОЙСК ДЛЯ АТАКИ";
                                }
                            } else {
                                statusEl.innerText = "ВРАГ НЕ ГРАНИЧИТ С ВАМИ";
                            }
                        }
                    }
                }
            }
        }
        cam.isDrag = false;
    });

    canvas.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    canvas.addEventListener('wheel', function(e) {
        if (gameEnded) {
            e.preventDefault();
            return;
        }

        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const wx = (mx - cam.x) / cam.zoom;
        const wy = (my - cam.y) / cam.zoom;
        cam.zoom = Math.min(Math.max(cam.zoom * (e.deltaY > 0 ? 0.9 : 1.1), 0.05), 5);
        cam.x = mx - wx * cam.zoom;
        cam.y = my - wy * cam.zoom;
        e.preventDefault();
    });

    canvas.addEventListener('click', (e) => {
        // Если игра окончена и мы не в режиме наблюдения, клики не работают
        if (gameEnded || isSpectating) return;

        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left - cam.x) / cam.zoom;
        const y = (e.clientY - rect.top - cam.y) / cam.zoom;
        const c = Math.floor(x / CELL_SIZE);
        const r = Math.floor(y / CELL_SIZE);

        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

        const cell = grid[r][c];
        const p = players[0]; // Игрок всегда первый в массиве

        // Исправление ошибки: проверяем, существует ли игрок
        if (!p) return;

        if (preStart) {
            if (cell.type !== 'water') {
                p.capture(r, c);
                preStart = false;
                gameStarted = true;
                statusEl.innerText = "ГЛОБАЛЬНАЯ ЭКСПАНСИЯ";
            }
            return;
        }

        // Логика атаки игрока
        if (cell.owner !== null && cell.owner !== 0) {
            const targetId = cell.owner;
            const percent = parseInt(slider.value);
            const attackAmount = p.troops * (percent / 100);

            if (attackAmount > 10) {
                p.troops -= attackAmount;
                // Создаем объект атаки
                p.attacks.push({
                    target: targetId,
                    troops: attackAmount,
                    initialTroops: attackAmount,
                    progress: 1.0
                });
                statusEl.innerText = "ВОЙСКА ОТПРАВЛЕНЫ!";
            }
        }
    });

    slider.addEventListener('input', function() {
        percentVal.innerText = slider.value;
        updateAttackTroopsInfo();
    });

    let frameCount = 0;
    function update() {
        frameCount++;

        updateHoverInfo();


        if (!checkGameEnd() && gameStarted) {

            for (let i = 0; i < players.length; i++) {
                if (players[i]) {
                    players[i].update();
                }
            }

            if(players[0]) {
                troopEl.innerText = formatNum(players[0].troops);
                limitEl.innerText = `Лимит: ${formatNum(players[0].maxTroops)}`;
                goldEl.innerText = formatNum(players[0].gold);
                landEl.innerText = players[0].cells.length;
                updateAttackTroopsInfo();
                updateAttackingTroopsBar();

                if (players[0].attacks && players[0].attacks.length > 0) {
                    // Средний прогресс по всем атакам
                    let totalProgress = players[0].attacks.reduce((sum, attack) => sum + attack.progress, 0);
                    let avgProgress = totalProgress / players[0].attacks.length;
                    attackProgressBar.style.width = (avgProgress * 100) + '%';
                } else if (players[0].expansionQueue > 0) {
                    attackProgressBar.style.width = '50%';
                } else {
                    attackProgressBar.style.width = '0%';
                    if (statusEl.innerText.includes("АТАКА") || statusEl.innerText.includes("РАСШИРЕНИЕ")) {
                        statusEl.innerText = "ГЛОБАЛЬНАЯ ЭКСПАНСИЯ";
                    }
                }
            }
        }

        draw();
        requestAnimationFrame(update);

        // --- FPS ---
        const now = performance.now();
        const delta = now - lastFrameTime;
        lastFrameTime = now;
        // обновляем FPS только раз в 500 мс
        if (now - lastFpsUpdate > 250) {
            fps = 1000 / delta;
            lastFpsUpdate = now;
        }

        ctx.save();
        ctx.fillStyle = 'lime';
        ctx.font = '16px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('FPS: ' + fps.toFixed(1), canvas.width - 10, 20);
        ctx.restore();

    }

    setInterval(() => {
        for (let p of players) {
            if (p) p.update();
        }
    }, 16); // примерно 60 FPS


    function draw() {
        // 1. Очищаем основной канвас
        ctx.fillStyle = "#050a14";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(cam.x, cam.y);
        ctx.scale(cam.zoom, cam.zoom);

        // Отключаем сглаживание для четкости пикселей при масштабировании
        ctx.imageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        // 2. ГЛАВНОЕ ИСПРАВЛЕНИЕ: Рисуем готовую карту из буфера одной командой
        // Это заменяет тысячи циклов и создание landCanvas, которые вызывали лаги
        ctx.drawImage(mapCanvas, 0, 0);

        // === НАЗВАНИЕ ИГРЫ (движется вместе с картой) ===
// === НАЗВАНИЕ ИГРЫ (красиво, читаемо, без переливов с морем) ===
        ctx.save();

        const titleText = "MapWars";
        const titleX = (COLS * CELL_SIZE) / 2;
        const titleY = 30;

        ctx.font = `bold 60px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";

// --- размеры текста ---
        const metrics = ctx.measureText(titleText);
        const paddingX = 28;
        const paddingY = 14;
        const bgWidth = metrics.width + paddingX * 2;
        const bgHeight = 60 + paddingY * 2;

// --- ТЁМНАЯ ПОДЛОЖКА (стабильная, без ряби) ---
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.beginPath();
        ctx.roundRect(
            titleX - bgWidth / 2,
            titleY - paddingY,
            bgWidth,
            bgHeight,
            14
        );
        ctx.fill();

        // --- обводка ---
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(16,29,48,0.8)";
        ctx.strokeText(titleText, titleX, titleY);

        // --- основной текст ---
        ctx.fillStyle = "#179517";
        ctx.fillText(titleText, titleX, titleY);

        ctx.restore();



        // 3. Рисуем вспомогательные элементы (спавны ботов)
        if (preStart) {
            ctx.save();

            botSpawns.forEach((spawn, index) => {
                const isAggro = index < 4;
                const colorIndex = (index + 1) % COLORS.length;
                const baseColor = COLORS[colorIndex];
                const botName = NAMES[colorIndex] || `Бот ${index + 1}`;

                const centerX = spawn.c * CELL_SIZE + CELL_SIZE / 2;
                const centerY = spawn.r * CELL_SIZE + CELL_SIZE / 2;
                const radius = 25;

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);

                if (isAggro) {
                    // АГРЕССОР
                    ctx.fillStyle = baseColor + "66"; // Заливка 40% яркости
                    ctx.fill();

                    ctx.setLineDash([]);
                    ctx.strokeStyle = baseColor;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.fillStyle = baseColor;
                    ctx.font = "bold 12px Arial";
                    ctx.textAlign = "center";
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "black";
                    ctx.fillText(botName.toUpperCase(), centerX, centerY - radius - 8);
                    ctx.shadowBlur = 0;
                } else {
                    // ПАССИВНЫЙ (Исправлено: добавлена заливка)
                    ctx.fillStyle = baseColor + "33"; // Заливка 20% яркости (более тусклая)
                    ctx.fill(); // <--- ОБЯЗАТЕЛЬНО вызвать для отображения цвета внутри

                    ctx.setLineDash([5, 5]);
                    ctx.strokeStyle = baseColor;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = baseColor;
                    ctx.font = "11px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(botName, centerX, centerY - radius - 5);
                }
            });
            ctx.restore();
        }

        // 4. Рисуем имена игроков и количество войск поверх карты
        if (!preStart) {
            for (let i = 0; i < players.length; i++) {
                let p = players[i];
                // Рисуем ник, если у игрока есть территория
                if (p && p.cells.length > 30) {
                    let fSize = Math.max(12, 18 / cam.zoom);

                    ctx.save();
                    ctx.fillStyle = "white";
                    ctx.font = `bold ${fSize}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.strokeStyle = "black";
                    ctx.lineWidth = 4 / cam.zoom;

                    let screenX = p.nameX;
                    let screenY = p.nameY;

                    // Оптимизация: не рисуем текст, если он далеко за пределами экрана
                    if (screenX > -100 && screenX < (COLS * CELL_SIZE) + 100 &&
                        screenY > -100 && screenY < (ROWS * CELL_SIZE) + 100) {

                        ctx.strokeText(p.name, screenX, screenY);
                        ctx.fillText(p.name, screenX, screenY);

                        // Войска под ником
                        ctx.font = `${fSize * 0.7}px monospace`;
                        let displayTroops = Math.round(p.troops);
                        ctx.strokeText(formatNum(displayTroops), screenX, screenY + (fSize * 1.2));
                        ctx.fillText(formatNum(displayTroops), screenX, screenY + (fSize * 1.2));
                    }
                    ctx.restore();
                }
            }
        }

        ctx.restore();
    }

    window.onresize = () => {
        canvas.width = window.innerWidth - 560;
        canvas.height = window.innerHeight;
        centerMapOnScreen();
    };

    initMap();
    update();
</script>
</body>
